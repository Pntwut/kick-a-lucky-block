<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Queue Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  font-family: 'Kanit', sans-serif;
  padding: 12px;
  width: 280px;
}
.header {
  font-size: 13px; font-weight: 700; color: #22c55e;
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.header-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e; box-shadow: 0 0 6px #22c55e;
}
.queue { display: flex; flex-direction: column; gap: 5px; }
.q-item {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,0.65); border-radius: 8px;
  padding: 7px 10px; border-left: 3px solid transparent;
  animation: fadeIn .3s ease;
}
.q-item.first { border-left-color: #22c55e; background: rgba(0,0,0,0.75); }
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.rank { font-size: 11px; color: rgba(255,255,255,0.35); width: 16px; text-align: center; flex-shrink: 0; }
.rank.first { color: #22c55e; font-weight: 700; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.name { font-size: 14px; font-weight: 500; color: #fff; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name.first { font-weight: 700; }
.kicks {
  font-size: 12px; font-weight: 700; color: #22c55e;
  background: rgba(34,197,94,0.15); border-radius: 20px;
  padding: 1px 8px; flex-shrink: 0;
}
.empty { font-size: 12px; color: rgba(255,255,255,0.3); padding: 8px 0; }

/* setup prompt */
.setup-box {
  background: rgba(0,0,0,0.8); border-radius: 10px; padding: 14px;
  border: 1px solid rgba(34,197,94,0.3);
}
.setup-box p { font-size: 12px; color: #94a3b8; margin-bottom: 8px; line-height: 1.6; }
.setup-box input {
  width: 100%; background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
  color: #fff; font-family: 'Kanit', sans-serif; font-size: 12px;
  height: 32px; padding: 0 10px; margin-bottom: 8px; outline: none;
}
.setup-box button {
  width: 100%; height: 32px; background: #22c55e; border: none;
  border-radius: 6px; color: #0a0e1a; font-family: 'Kanit', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
</style>
</head>
<body>

<div id="setup-prompt" style="display:none">
  <div class="setup-box">
    <p>ใส่ Firebase URL ของคุณ<br>(เปิดจาก index.html ก่อนเพื่อ setup)</p>
    <input id="url-input" type="text" placeholder="https://your-project-default-rtdb...">
    <button onclick="saveUrl()">บันทึก</button>
  </div>
</div>

<div id="main-overlay" style="display:none">
  <div class="header">
    <div class="header-dot"></div>
    คิวเตะ Lucky Block
  </div>
  <div class="queue" id="queue-list">
    <div class="empty">ยังไม่มีคิว...</div>
  </div>
</div>

<script>
const SETUP_KEY = 'klb_firebase_url';

const AVATAR_COLORS = [
  ['rgba(34,197,94,0.3)',  '#22c55e'],
  ['rgba(59,130,246,0.3)', '#60a5fa'],
  ['rgba(234,179,8,0.3)',  '#eab308'],
  ['rgba(168,85,247,0.3)', '#c084fc'],
  ['rgba(249,115,22,0.3)', '#fb923c'],
  ['rgba(236,72,153,0.3)', '#f472b6'],
];

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) { return name.slice(0, 2).toUpperCase(); }

function getDbRef() {
  const url = localStorage.getItem(SETUP_KEY);
  return url ? `${url}/klb.json` : null;
}

function saveUrl() {
  const url = document.getElementById('url-input').value.trim().replace(/\/$/, '');
  if (!url.startsWith('https://')) { alert('URL ไม่ถูกต้อง'); return; }
  localStorage.setItem(SETUP_KEY, url);
  startOverlay();
}

function startOverlay() {
  document.getElementById('setup-prompt').style.display = 'none';
  document.getElementById('main-overlay').style.display = 'block';
  fetchAndRender();
  setInterval(fetchAndRender, 2000);
}

let lastSnapshot = '';

async function fetchAndRender() {
  const ref = getDbRef();
  if (!ref) return;
  try {
    const res = await fetch(ref);
    const raw = await res.text();
    if (raw === lastSnapshot) return;
    lastSnapshot = raw;
    const d = JSON.parse(raw);
    const queue = d?.queue || [];
    const el = document.getElementById('queue-list');
    if (queue.length === 0) {
      el.innerHTML = '<div class="empty">ยังไม่มีคิว...</div>';
      return;
    }
    el.innerHTML = queue.slice(0, 8).map((q, i) => {
      const [bg, fg] = colorFor(q.name);
      const isFirst  = i === 0;
      return `<div class="q-item${isFirst ? ' first' : ''}">
        <div class="rank${isFirst ? ' first' : ''}">${isFirst ? '▶' : i + 1}</div>
        <div class="avatar" style="background:${bg};color:${fg}">${initials(q.name)}</div>
        <div class="name${isFirst ? ' first' : ''}">${q.name}</div>
        <div class="kicks">${q.kicks} เตะ</div>
      </div>`;
    }).join('');
  } catch (_) {}
}

// Init
if (localStorage.getItem(SETUP_KEY)) {
  startOverlay();
} else {
  document.getElementById('setup-prompt').style.display = 'block';
}
</script>
</body>
</html>
