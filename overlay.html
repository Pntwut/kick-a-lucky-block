<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Queue Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  font-family: 'Kanit', sans-serif;
  padding: 12px;
  width: 280px;
}
.header {
  font-size: 13px; font-weight: 700; color: #22c55e;
  letter-spacing: 1px; text-transform: uppercase;
  margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.header-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e; box-shadow: 0 0 6px #22c55e;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.queue { display: flex; flex-direction: column; gap: 5px; }
.q-item {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,0.65); border-radius: 8px;
  padding: 7px 10px; border-left: 3px solid transparent;
  animation: fadeIn .3s ease;
}
.q-item.first { border-left-color: #22c55e; background: rgba(0,0,0,0.75); }
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.rank { font-size: 11px; color: rgba(255,255,255,0.35); width: 16px; text-align: center; flex-shrink: 0; }
.rank.first { color: #22c55e; font-weight: 700; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.name { font-size: 14px; font-weight: 500; color: #fff; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name.first { font-weight: 700; }
.kicks {
  font-size: 12px; font-weight: 700; color: #22c55e;
  background: rgba(34,197,94,0.15); border-radius: 20px;
  padding: 1px 8px; flex-shrink: 0;
}
.empty { font-size: 12px; color: rgba(255,255,255,0.3); padding: 8px 0; }
.error {
  font-size: 11px; color: #ef4444; padding: 10px 12px;
  background: rgba(239,68,68,0.1); border-radius: 8px;
  border: 1px solid rgba(239,68,68,0.2); line-height: 1.6;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-dot"></div>
  คิวเตะ Lucky Block
</div>
<div class="queue" id="queue-list">
  <div class="empty">กำลังโหลด...</div>
</div>

<script>
const AVATAR_COLORS = [
  ['rgba(34,197,94,0.3)',  '#22c55e'],
  ['rgba(59,130,246,0.3)', '#60a5fa'],
  ['rgba(234,179,8,0.3)',  '#eab308'],
  ['rgba(168,85,247,0.3)', '#c084fc'],
  ['rgba(249,115,22,0.3)', '#fb923c'],
  ['rgba(236,72,153,0.3)', '#f472b6'],
];

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initials(name) { return name.slice(0, 2).toUpperCase(); }

// อ่าน Firebase URL จาก ?db=... parameter
const params = new URLSearchParams(location.search);
const dbUrl  = params.get('db');
const dbRef  = dbUrl ? `${dbUrl}/klb.json` : null;

const el = document.getElementById('queue-list');

if (!dbRef) {
  el.innerHTML = '<div class="error">ไม่พบ Firebase URL<br>กด "ก็อปลิ้งค์คิว" จากหน้าหลักแล้ววางใหม่ครับ</div>';
} else {
  let lastSnapshot = '';

  async function fetchAndRender() {
    try {
      const res = await fetch(dbRef);
      const raw = await res.text();
      if (raw === lastSnapshot) return;
      lastSnapshot = raw;
      const d     = JSON.parse(raw);
      const queue = d?.queue || [];

      if (queue.length === 0) {
        el.innerHTML = '<div class="empty">ยังไม่มีคิว...</div>';
        return;
      }
      el.innerHTML = queue.slice(0, 8).map((q, i) => {
        const [bg, fg] = colorFor(q.name);
        const isFirst  = i === 0;
        const results  = q.results || [];
        const resultsHtml = results.length > 0
          ? `<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;padding-left:44px">
               ${results.map((r,j) => `<span style="margin-right:6px">${j+1}.${r}</span>`).join('')}
             </div>`
          : '';
        return `<div style="margin-bottom:3px">
          <div class="q-item${isFirst ? ' first' : ''}">
            <div class="rank${isFirst ? ' first' : ''}">${isFirst ? '▶' : i + 1}</div>
            <div class="avatar" style="background:${bg};color:${fg}">${initials(q.name)}</div>
            <div class="name${isFirst ? ' first' : ''}">${q.name}</div>
            <div class="kicks">${q.kicks} เตะ</div>
          </div>
          ${resultsHtml}
        </div>`;
      }).join('');
    } catch (_) {}
  }

  fetchAndRender();
  setInterval(fetchAndRender, 2000);
}
</script>
</body>
</html>
